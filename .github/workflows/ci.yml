name: CI

on: [push, pull_request]

jobs:
  build-windows-2022-psx:
    runs-on: windows-2022
    name: PSX

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Requirements
      run: pip install -r requirements.txt

      # TODO: add ci verification at some point
    - name: Build PSX
      run: python build.py --no-verify

    #- name: Upload PSX Artifacts
    #  uses: actions/upload-artifact@v4
    #  with:
    #    name: jade-cocoon-psx
    #    path: build_psyq/jade_cocoon.exe
    #    retention-days: 7

  build-windows-2022-pc:
    runs-on: windows-2022
    name: Windows PC Port

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Windows PC Port
      run: |
        mkdir build
        cd build
        cmake -S .. -B . -G"Visual Studio 17 2022" -A x64
        cmake --build . --config Release

    - name: Upload Windows PC Port Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jade-cocoon-windows
        path: build/jade_cocoon.exe
        retention-days: 7

  build-linux-latest-pc:
    runs-on: ubuntu-latest
    name: Linux PC Port

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install SDL3 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing \
          libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
          libx11-dev libxext-dev libxrandr-dev \
          libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libxkbcommon-dev \
          libdrm-dev libgbm-dev libgl1-mesa-dev \
          libgles2-mesa-dev libegl1-mesa-dev \
          libdbus-1-dev libibus-1.0-dev libudev-dev \
          libthai-dev libusb-1.0-0-dev

    - name: Build Linux PC Port
      run: |
        mkdir build
        cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Debug
        cmake --build .

    - name: Upload Linux PC Port Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jade-cocoon-linux
        path: build/jade_cocoon
        retention-days: 7
