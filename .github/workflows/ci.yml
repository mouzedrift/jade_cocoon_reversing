name: CI

on: [push, pull_request]

jobs:
  build-windows-2022:
    runs-on: windows-2022
    name: Windows PC Port

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Windows PC Port
      run: |
        mkdir build
        cd build
        cmake -S .. -B . -G"Visual Studio 17 2022" -A x64
        cmake --build . --config Release

    - name: Upload Windows PC Port Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jade-cocoon-windows
        path: build/jade_cocoon.exe
        retention-days: 7

  build-linux-latest:
    runs-on: ubuntu-latest
    name: Linux PC Port

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Linux PC Port
      run: |
        mkdir build
        cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Debug
        cmake --build .

    - name: Upload Linux PC Port Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jade-cocoon-linux
        path: build/jade_cocoon
        retention-days: 7
